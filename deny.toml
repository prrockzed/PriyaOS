# cargo-deny: which crates PriyaOS may depend on (sub-phase 0.3, QA-10).
# CI runs `cargo deny check licenses advisories bans sources`.

[graph]
# The platforms PriyaOS builds for: the Zenbook and other Arch machines, and
# the Mac for the portable crates.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
# Known vulnerabilities and unsound crates always fail. Yanked crates fail.
# An unmaintained crate fails only when we depend on it directly; deep in the
# tree it can't be fixed quickly, and the nightly run reports it.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Compatible with Apache-2.0 (ADR-022). Copyleft licences are left out on
# purpose; adding one needs an ADR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory; unused entries are fine.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are Apache-2.0 and unpublished; check them anyway.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
