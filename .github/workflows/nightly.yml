# Nightly checks against main (sub-phase 0.3). A failure opens (or updates)
# one issue labelled nightly-failure; the next green night closes it.
# The flaky hunt re-runs quarantined tests (0.4). The regression suite
# (`cargo xtask test regression --all`) replaces the tests job's full run
# once enough tests are promoted.
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: Fail on purpose, to check that the report issue opens.
        type: boolean
        default: false

permissions:
  contents: read
  # The tests job pulls the private CI image.
  packages: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Advisories, against a freshly fetched database
        run: cargo deny check advisories

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/prrockzed/priyaos-ci@sha256:1b3b609269e0336b9e1b8b5a60dff9bed77140dd97e719d86abadecb168431a4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Every test in the workspace
        run: cargo nextest run --workspace --profile ci --locked
      - name: Forced failure (manual runs only)
        if: inputs.force_failure
        run: |
          echo "Failing on purpose (force_failure was set)."
          exit 1

  flaky-hunt:
    # Each quarantined test 50 times and the unit and contract suites 5
    # times, never retrying; pass rates go on the tracking issues.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/prrockzed/priyaos-ci@sha256:1b3b609269e0336b9e1b8b5a60dff9bed77140dd97e719d86abadecb168431a4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo xtask flaky hunt --runs 50 --suite-runs 5
      - name: Keep the pass rates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-hunt
          path: target/trace/flaky-hunt.json
          if-no-files-found: ignore

  flaky-comments:
    needs: flaky-hunt
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flaky-hunt
        continue-on-error: true
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("flaky-hunt.json")) return;
            const results = JSON.parse(fs.readFileSync("flaky-hunt.json", "utf8"));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const r of results) {
              const rate = r.runs ? Math.round((100 * r.passed) / r.runs) : 0;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: r.issue,
                body: `Nightly flaky hunt: \`${r.test}\` passed ${r.passed}/${r.runs} runs (${rate}%). ${runUrl}`,
              });
            }

  report:
    needs: [advisories, tests, flaky-hunt, flaky-comments]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const label = "nightly-failure";
            const needs = JSON.parse(process.env.NEEDS);
            const failed = Object.entries(needs)
              .filter(([, job]) => job.result !== "success")
              .map(([name, job]) => `${name}: ${job.result}`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: label,
            });
            const issue = open[0];

            if (failed.length === 0) {
              if (issue) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Green again: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: "closed",
                });
              }
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: "C42B1C",
                description: "The nightly workflow failed",
              });
            }

            const body = `The nightly run failed: ${runUrl}\n\n${failed.map((f) => `- ${f}`).join("\n")}`;
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title: "Nightly run failed", labels: [label], body,
              });
            }
