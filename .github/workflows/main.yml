# Runs after every merge to main (sub-phases 0.3 and 0.4): the full CI, then
# the permanent regression suite. The package build joins in 0.14.
name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read
  # ci.yml pulls the private CI image. Its coverage and pr-report jobs ask
  # for pull-request access; they do nothing on main, but a caller must
  # grant at least what the called jobs request.
  packages: read
  pull-requests: write

concurrency:
  # Not ci-${{ github.ref }}: ci.yml uses that group, and sharing it with the
  # workflow it calls makes GitHub cancel the run as a deadlock.
  group: main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # A caller must grant at least what the called jobs ask for, or the run
    # doesn't start. pr-report asks for `contents: write` (it pushes PR
    # screenshots); it runs only for pull requests, so not here.
    permissions:
      contents: write
      packages: read
      pull-requests: write

  regression:
    # The permanent regression suite (tests tagged `regression:`), after CI.
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/prrockzed/priyaos-ci@sha256:1b3b609269e0336b9e1b8b5a60dff9bed77140dd97e719d86abadecb168431a4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo xtask test regression --fast --profile ci
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-regression
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
