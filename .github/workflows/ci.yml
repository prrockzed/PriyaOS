# Checks every change (sub-phase 0.3). Branch protection requires only the
# `ci-pass` job, which waits for all the others; a unit test in
# xtask/src/workflows.rs fails if a job is left out of its `needs`.
name: CI

on:
  # A branch with an open PR runs twice (push and pull_request). Accepted:
  # the push run gives feedback before a PR exists, and minutes are free for
  # public repositories.
  pull_request:
  push:
    # main.yml calls this workflow for main, so it isn't run twice there.
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read
  # Pull the private CI image from ghcr.io.
  packages: read

concurrency:
  # A caller (main.yml) must use a different group name, or GitHub
  # cancels this workflow as a deadlock.
  group: ci-${{ github.ref }}
  # A newer push to a branch replaces the older run; runs on main all finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    container: &ci-image
      # The Arch CI image (ci/Dockerfile), by digest; Renovate bumps it.
      image: ghcr.io/prrockzed/priyaos-ci@sha256:1b3b609269e0336b9e1b8b5a60dff9bed77140dd97e719d86abadecb168431a4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    container: *ci-image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tokens:
    # Generated theme files match ui/design/tokens.json and every contrast
    # pair passes (0.10). The ui job tests the Theme singleton in Qt.
    runs-on: ubuntu-24.04
    container: *ci-image
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo xtask tokens --check
      - name: Keep the contrast report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contrast-report
          path: target/design/contrast.md
          if-no-files-found: ignore

  deny:
    runs-on: ubuntu-24.04
    container: *ci-image
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Licences, advisories, bans and sources of Rust crates
        run: cargo deny check licenses advisories bans sources
      - name: Third-party files outside Cargo
        run: cargo xtask licenses

  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress '**/*.md'
          fail: true

  build-linux:
    runs-on: ubuntu-24.04
    container: *ci-image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo build --workspace --all-targets --locked

  build-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Build the portable crates
        run: |
          scope=$(cargo xtask portable)
          # shellcheck disable=SC2086 # one word per argument
          cargo build --all-targets --locked $scope

  test-linux:
    runs-on: ubuntu-24.04
    container: *ci-image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Every test, measuring coverage on the way
        # One run gives the JUnit report (trace) and the lcov report
        # (coverage), so the tests don't run twice.
        run: |
          mkdir -p target/coverage
          cargo llvm-cov nextest --workspace --profile ci --locked \
            --lcov --output-path target/coverage/lcov.info
      - name: Collect the reports
        if: always()
        run: |
          mkdir -p target/reports
          # llvm-cov builds in its own target folder, so find the report.
          junit=$(find target -path '*/nextest/ci/junit.xml' | head -n 1)
          [ -n "$junit" ] && cp "$junit" target/reports/junit.xml
          [ -f target/coverage/lcov.info ] && cp target/coverage/lcov.info target/reports/
          true
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-linux
          path: target/reports/junit.xml
          if-no-files-found: ignore
      - name: Keep the coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-linux
          path: target/reports/lcov.info
          if-no-files-found: ignore

  test-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Test the portable crates
        run: |
          scope=$(cargo xtask portable)
          # shellcheck disable=SC2086 # one word per argument
          cargo nextest run --profile ci --locked $scope
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-macos
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  scripts:
    runs-on: ubuntu-24.04
    container: *ci-image
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Lint shell scripts
        run: bash scripts/lint-shell.sh
      - name: Script tests
        run: bash scripts/tests/run.sh
      - name: Keep the script results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: script-results
          path: target/trace/script-results.json
          if-no-files-found: ignore

  ui:
    # The ui suite (0.11): the UI lint, QML component tests with
    # qmltestrunner offscreen (their results feed the trace job), and a
    # screenshot of every gallery story under cage, compared with
    # ui/tests/baselines. A pull request that changes a baseline needs the
    # owner's `visual-change-approved` label; adding it and re-running this
    # job is enough.
    runs-on: ubuntu-24.04
    container: *ci-image
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch is needed to see which baselines changed.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: UI lint (tokens only, qsTr, spoken names)
        run: cargo xtask ui lint
      - name: UI strings are all in ui/i18n/priya_en.ts
        run: cargo xtask ui i18n --check
      - name: UI tests
        run: cargo xtask test ui --profile ci
      - name: Keep the UI test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-results
          path: target/trace/ui-results.json
          if-no-files-found: ignore
      - name: Keep the screenshots and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shots
          path: target/ui-shots
          if-no-files-found: ignore
      - uses: ./.github/actions/pr-details
        if: ${{ !cancelled() }}
      - name: Changed baselines need the owner's approval
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "Not a pull request: nothing to compare with."
            exit 0
          fi
          labels=()
          while IFS= read -r label; do
            [ -n "$label" ] && labels+=(--label "$label")
          done <"$RUNNER_TEMP/pr-labels.txt"
          cargo xtask ui baselines-guard --base "origin/$BASE_REF" "${labels[@]}"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-gitleaks
      - name: Scan the new commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: bash ci/gitleaks-range.sh
      - uses: ./.github/actions/setup-rust
        if: ${{ !cancelled() }}
      - name: Recorded fixtures are documented and secret-free
        # Runs even when the commit scan failed, so both results show.
        if: ${{ !cancelled() }}
        run: cargo xtask fixtures check

  coverage:
    # Changed Rust lines must be tested (xtask/coverage.toml), using the
    # lcov report from test-linux. Only pull requests have a base to compare
    # with; other runs pass straight away.
    needs: test-linux
    runs-on: ubuntu-24.04
    container: *ci-image
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      # The labels and description are read when the job runs, so adding
      # `coverage-exception` and re-running this job is enough.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov-linux
          path: run/coverage
      - uses: ./.github/actions/pr-details
      - name: Diff coverage
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "Not a pull request: nothing to compare with."
            exit 0
          fi
          labels=()
          while IFS= read -r label; do
            [ -n "$label" ] && labels+=(--label "$label")
          done <"$RUNNER_TEMP/pr-labels.txt"
          cargo xtask coverage --base "origin/$BASE_REF" --lcov run/coverage/lcov.info \
            --pr-body "$RUNNER_TEMP/pr-body.txt" "${labels[@]}"
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage/report.md
          if-no-files-found: ignore

  flaky:
    # The quarantine stays small and short; the list goes in the run summary.
    runs-on: ubuntu-24.04
    container: *ci-image
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo xtask flaky check
      - name: Keep the quarantine list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarantine
          path: target/trace/quarantine.md
          if-no-files-found: ignore

  trace:
    # Checks every test's tags against features.md and the phase files,
    # using this run's results (sub-phase 0.4).
    needs: [test-linux, scripts, ui]
    runs-on: ubuntu-24.04
    container: *ci-image
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      # The description is read when the job runs (ADR citations).
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch is needed to spot removed regression tests.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: junit-linux
          path: run/junit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: script-results
          path: run/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-results
          path: run/ui
      - uses: ./.github/actions/pr-details
      - name: Check traceability
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=()
          if [ -n "$BASE_REF" ]; then base=(--base "origin/$BASE_REF"); fi
          cargo xtask trace \
            --junit run/junit/junit.xml \
            --results run/scripts/script-results.json \
            --results run/ui/ui-results.json \
            --pr-body "$RUNNER_TEMP/pr-body.txt" \
            "${base[@]}"
      - name: Keep the traceability matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traceability-matrix
          path: |
            target/trace/matrix.md
            target/trace/matrix.json
            target/trace/tests.json
            target/trace/changes.md
          if-no-files-found: ignore

  pr-report:
    # One comment per pull request, updated on every run: diff coverage,
    # traceability changes and the quarantine list. A report, not a gate, so
    # it isn't in ci-pass. Skipped for forks, whose token can't comment.
    needs: [coverage, trace, flaky, ui]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: coverage
          path: report/coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: traceability-matrix
          path: report/trace
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: quarantine
          path: report/quarantine
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ui-shots
          path: report/ui-shots
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- priyaos-pr-report -->";
            const section = (path, missing) =>
              fs.existsSync(path) ? fs.readFileSync(path, "utf8").trim() : missing;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = [
              marker,
              "## PR report",
              section("report/coverage/report.md", "### Diff coverage\n\nNo report (the coverage job didn't finish)."),
              section("report/trace/changes.md", "### Traceability\n\nNo report (the trace job didn't finish)."),
              section("report/quarantine/quarantine.md", "### Quarantined tests\n\nNo report."),
              section("report/ui-shots/report.md", "### UI screenshots\n\nNo report (the ui job didn't finish)."),
              "Schema changes (0.9) join this report later.",
              `For commit ${context.payload.pull_request.head.sha.slice(0, 7)}. [Run details and the full traceability matrix](${runUrl})`,
            ].join("\n\n");
            // GitHub refuses comments over 65,536 characters.
            const limit = 60000;
            if (body.length > limit) {
              body = body.slice(0, limit) + `\n\n…cut short; see [the run](${runUrl}).`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            // Only this job's own comment, never a person's pasted copy.
            const mine = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.startsWith(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  ci-pass:
    # always(): if a needed job fails, a plain job would be skipped, and
    # GitHub counts a skipped required check as passed.
    if: always()
    needs:
      - fmt
      - clippy
      - tokens
      - deny
      - typos
      - links
      - build-linux
      - build-macos
      - test-linux
      - test-macos
      - scripts
      - ui
      - secrets
      - coverage
      - flaky
      - trace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
