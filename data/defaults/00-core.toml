# PriyaOS default settings. Installed as /usr/share/priya/defaults/00-core.toml.
#
# Don't edit this file: put your changes in ~/.config/priya/settings.toml,
# which overrides it key by key. These values match the defaults built into
# PriyaOS; a test keeps the two in step.

settings_version = 1

[ui]
theme = "dark"            # light or dark
reduced_motion = false    # fewer and shorter animations

[ui.bar]
width_px = 720            # width of the Priya bar

[ai]
# strategy is unset until you choose a model, for example:
# strategy = "fixed:local/qwen2.5:0.5b"     (a model on this laptop)
# strategy = "fixed:gemini/gemini-2.5-flash" (first: priya ai key set gemini)
max_output_tokens = 2048  # the longest answer, in tokens

# One table per provider; API keys live in the keyring, never here.
[ai.providers.local]      # a model server on this laptop, such as Ollama
kind = "openai_compatible"
base_url = "http://127.0.0.1:11434/v1"
enabled = true

[ai.providers.gemini]     # Google Gemini, which has a free tier
kind = "openai_compatible"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
enabled = true

[log]
level = "info"            # error, warn, info, debug or trace

[modules]
enabled = []              # modules to start
