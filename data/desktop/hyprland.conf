# PriyaOS's lines for Hyprland 0.54 and earlier, or a config still in
# hyprland.conf, installed to /usr/share/priya/desktop/hyprland.conf. Add
# this to ~/.config/hypr/hyprland.conf:
#   source = /usr/share/priya/desktop/hyprland.conf
# (With a Lua config, Hyprland 0.55 and later, use
# /usr/share/priya/desktop/hyprland.lua instead.)

# Super+Space opens and closes the Priya bar.
bind = SUPER, SPACE, exec, qs -p /usr/share/priya/shell ipc call priya-bar toggle

# The bar's shell needs the session's Wayland and Hyprland details, which
# systemd learns here; then it starts.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP && systemctl --user start priya-shell

# No layer rule: Hyprland doesn't blur layers unless asked, and the bar
# draws its own shadow.
