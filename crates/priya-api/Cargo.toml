[package]
name = "priya-api"
description = "Versioned wire types and the error model of the PriyaOS API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
toml_edit = { workspace = true, features = ["serde"] }
tokio = { workspace = true, optional = true }
ulid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# test-util: paused time, so timeouts are tested without waiting.
tokio = { workspace = true, features = ["test-util"] }

[features]
# The async client over the daemon's socket (the CLI, tests, Rust modules).
client = ["dep:tokio"]
# Both-ways JSON-RPC between priyad and modules, over channels or stdio.
peer = ["dep:tokio"]

[lints]
workspace = true
