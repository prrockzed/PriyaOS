[package]
name = "priya-testkit"
description = "Fakes, fixtures and helpers shared by PriyaOS tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
insta.workspace = true
priya-ai.workspace = true
priya-api = { workspace = true, features = ["client"] }
priya-core.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
ulid.workspace = true

[dev-dependencies]
# test-util: paused time, so retries are tested without waiting.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
