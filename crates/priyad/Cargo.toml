[package]
name = "priyad"
description = "The per-user PriyaOS daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
jsonschema.workspace = true
notify.workspace = true
priya-ai.workspace = true
priya-api = { workspace = true, features = ["peer"] }
priya-core.workspace = true
priya-logging.workspace = true
priya-module-sdk.workspace = true
priya-store.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
ulid.workspace = true

priya-echo-example = { workspace = true, optional = true }

[features]
# Builds the echo example module into priyad as a builtin, for trying the
# builtin kind by hand. Not packaged.
builtin-examples = ["dep:priya-echo-example"]

[dev-dependencies]
priya-echo-example.workspace = true
priya-testkit.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
