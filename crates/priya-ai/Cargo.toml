[package]
name = "priya-ai"
description = "Priya AI: model providers, catalog and routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
futures-core.workspace = true
priya-api.workspace = true
priya-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["macros"] }
tokio.workspace = true
tokio-stream.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The Secret Service, where keys live (05-security §3); Linux only.
oo7.workspace = true
# To tell "no keyring" from other D-Bus errors; the version oo7 uses.
zbus.workspace = true

[dev-dependencies]
priya-testkit.workspace = true
# test-util: paused time, so timeouts are tested without waiting.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
