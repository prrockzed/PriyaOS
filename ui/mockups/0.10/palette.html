<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PriyaOS palette</title>
<!-- Mockup for owner approval (0.10). Once approved, 0.10 rebuilds this page
     from the generated ui/design/build/tokens.css with the same values. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  [data-theme="light"] {
    --bg-base:#FAFAF7; --bg-surface1:#FFFFFF; --bg-surface2:#F3F3EF; --bg-surface3:#EAEAE4;
    --border-subtle:#DCDCD4; --border-strong:#83837B;
    --text-primary:#18181B; --text-secondary:#55555E; --text-tertiary:#64646D;
    --accent:#915500; --accent-subtle:#FFF1D6; --on-accent:#FFFFFF;
    --success:#1A7446; --warning:#A14B00; --danger:#C42B1C; --info:#1C66AA;
    --shadow:0 1px 2px rgba(24,24,27,.06), 0 4px 12px rgba(24,24,27,.06);
  }
  [data-theme="dark"] {
    --bg-base:#121214; --bg-surface1:#1A1A1F; --bg-surface2:#222229; --bg-surface3:#2B2B33;
    --border-subtle:#34343D; --border-strong:#75757F;
    --text-primary:#EDEDF0; --text-secondary:#A9A9B4; --text-tertiary:#9A9AA5;
    --accent:#F2B544; --accent-subtle:#3A2C10; --on-accent:#1A1300;
    --success:#3FB97A; --warning:#F08A24; --danger:#F5675C; --info:#4AA3F0;
    --shadow:0 0 0 1px var(--border-subtle);
  }
  [data-theme="oled"] {
    --bg-base:#000000; --bg-surface1:#0B0B0D; --bg-surface2:#151518; --bg-surface3:#1E1E23;
    --border-subtle:#26262C; --border-strong:#6C6C78;
    --text-primary:#EDEDF0; --text-secondary:#A9A9B4; --text-tertiary:#9A9AA5;
    --accent:#F2B544; --accent-subtle:#2A1F08; --on-accent:#1A1300;
    --success:#3FB97A; --warning:#F08A24; --danger:#F5675C; --info:#4AA3F0;
    --shadow:0 0 0 1px var(--border-subtle);
  }

  * { box-sizing:border-box; }
  body { margin:0; background:#DDDDD8; font-family:Inter, "Noto Sans Devanagari", system-ui, sans-serif; font-size:14px; line-height:1.45; }
  .page-head { padding:24px 16px 8px; max-width:1400px; margin:0 auto; color:#18181B; }
  .page-head h1 { font-size:24px; line-height:1.25; font-weight:600; margin:0 0 4px; }
  .page-head p { margin:0; color:#55555E; }
  .themes { display:grid; grid-template-columns:repeat(auto-fit, minmax(380px, 1fr)); gap:16px; padding:16px; max-width:1400px; margin:0 auto; }
  .theme { background:var(--bg-base); color:var(--text-primary); border-radius:16px; padding:24px; }
  .theme > h2 { font-size:20px; line-height:1.25; font-weight:600; margin:0 0 4px; }
  .theme > .note { color:var(--text-secondary); margin:0 0 24px; font-size:13px; }
  h3 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); margin:32px 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .sw { border-radius:10px; padding:12px; border:1px solid var(--border-subtle); min-height:72px; display:flex; flex-direction:column; justify-content:space-between; }
  .sw b { font-weight:500; font-size:13px; }
  .mono { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:12px; }
  .ratio { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:12px; font-variant-numeric:tabular-nums; }
  .ratio.ok::after { content:" ✓"; }
  .ratio.fail { color:var(--danger); font-weight:600; }
  .ratio.fail::after { content:" ✗"; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding:8px; text-align:left; }
  th { font-weight:500; color:var(--text-secondary); font-size:12px; }
  tr + tr td { border-top:1px solid var(--border-subtle); }
  .cell { border-radius:6px; padding:6px 8px; }

  .card { background:var(--bg-surface1); border-radius:10px; padding:16px; box-shadow:var(--shadow); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .btn { font:inherit; font-weight:500; border-radius:6px; padding:8px 16px; border:1px solid transparent; cursor:pointer; }
  .btn.primary { background:var(--accent); color:var(--on-accent); }
  .btn.secondary { background:var(--bg-surface2); color:var(--text-primary); border-color:var(--border-strong); }
  .btn.ghost { background:transparent; color:var(--accent); }
  .btn.danger { background:transparent; color:var(--danger); border-color:var(--danger); }
  .btn.focus { outline:2px solid var(--accent); outline-offset:2px; }
  .input { font:inherit; color:var(--text-primary); background:var(--bg-surface1); border:1px solid var(--border-strong); border-radius:6px; padding:8px 12px; width:100%; }
  .input::placeholder { color:var(--text-tertiary); }
  .pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:500; border:1px solid currentColor; }
  .pill i { width:8px; height:8px; border-radius:50%; background:currentColor; }
  .banner { border-radius:10px; padding:12px 16px; background:var(--accent-subtle); color:var(--text-primary); border-left:4px solid var(--accent); }
  .banner a { color:var(--accent); font-weight:500; }

  .type > div { display:flex; gap:12px; align-items:baseline; padding:6px 0; border-top:1px solid var(--border-subtle); }
  .type .label { flex:0 0 92px; color:var(--text-tertiary); font-size:12px; }
  .spaces { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .spaces div { text-align:center; font-size:12px; color:var(--text-secondary); }
  .spaces span { display:block; background:var(--accent); margin:0 auto 4px; }
  .radii { display:flex; gap:12px; flex-wrap:wrap; }
  .radii div { width:72px; height:56px; background:var(--bg-surface2); border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text-secondary); }
</style>
</head>
<body>
<div class="page-head">
  <h1>PriyaOS palette</h1>
  <p>Marigold accent. Every number is the measured contrast; text needs 4.5 or more, borders and focus rings need 3 or more.</p>
</div>
<div class="themes" id="themes"></div>

<template id="theme-tpl">
  <section class="theme">
    <h2 data-name></h2>
    <p class="note" data-note></p>

    <h3>Surfaces</h3>
    <div class="grid" data-surfaces></div>

    <h3>Text on every surface</h3>
    <table data-text></table>

    <h3>Status and mode colours</h3>
    <table data-status></table>
    <div class="row" style="margin-top:12px" data-modes></div>

    <h3>Controls</h3>
    <div class="card">
      <div class="row">
        <button class="btn primary">Run task</button>
        <button class="btn secondary">Cancel</button>
        <button class="btn ghost">Details</button>
        <button class="btn danger">Stop agent</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary focus">Focused</button>
        <span class="ratio" data-ratio="accent|bg-surface1|3">focus ring</span>
      </div>
      <div style="margin-top:12px"><input class="input" placeholder="Ask Priya…"></div>
      <div class="row" style="margin-top:6px; gap:16px">
        <span class="ratio" data-ratio="border-strong|bg-surface1|3">input border</span>
        <span class="ratio" data-ratio="on-accent|accent|4.5">button label</span>
      </div>
      <div class="banner" style="margin-top:12px">Priya changed 3 files. <a href="#">Undo</a></div>
    </div>

    <h3>Type</h3>
    <div class="type">
      <div><span class="label">display 32</span><span style="font-size:32px;line-height:1.25;font-weight:600">Good morning</span></div>
      <div><span class="label">headline 24</span><span style="font-size:24px;line-height:1.25;font-weight:600">Tasks today</span></div>
      <div><span class="label">title 20</span><span style="font-size:20px;line-height:1.25;font-weight:600">Fix the login bug</span></div>
      <div><span class="label">body-large 16</span><span style="font-size:16px">Priya found 2 ways to do this.</span></div>
      <div><span class="label">body 14</span><span>Runs in a sandbox, so your files stay safe.</span></div>
      <div><span class="label">small 13</span><span style="font-size:13px;color:var(--text-secondary)">Claude Code · 2 min · ₹4.20</span></div>
      <div><span class="label">caption 12</span><span style="font-size:12px;color:var(--text-tertiary)">Updated just now</span></div>
      <div><span class="label">हिन्दी 16</span><span style="font-size:16px">प्रिया ने 2 फ़ाइलें बदलीं। पूर्ववत करें?</span></div>
      <div><span class="label">mono 13</span><span class="mono" style="font-size:13px">priya ask "what changed?"</span></div>
    </div>

    <h3>Spacing</h3>
    <div class="spaces" data-spaces></div>

    <h3>Corners</h3>
    <div class="radii">
      <div style="border-radius:6px">control 6</div>
      <div style="border-radius:10px">card 10</div>
      <div style="border-radius:16px">panel 16</div>
      <div style="border-radius:999px">pill</div>
    </div>
  </section>
</template>

<script>
  const THEMES = [
    ["light", "Light", "Shadows give depth."],
    ["dark", "Dark", "Thin borders give depth."],
    ["oled", "OLED black", "Preview — selectable in Phase 5."],
  ];
  const SURFACES = [
    ["bg-base", "bg.base", "Page"], ["bg-surface1", "bg.surface1", "Cards"],
    ["bg-surface2", "bg.surface2", "Raised"], ["bg-surface3", "bg.surface3", "Hover"],
    ["accent-subtle", "accent.subtle", "Highlight"], ["accent", "accent", "Marigold"],
  ];
  const BGS = ["bg-base", "bg-surface1", "bg-surface2", "bg-surface3"];
  const TEXTS = [["text-primary", "Primary"], ["text-secondary", "Secondary"], ["text-tertiary", "Tertiary"], ["accent", "Accent link"]];
  const STATUS = [["success", "Success"], ["warning", "Warning"], ["danger", "Danger"], ["info", "Info"]];
  const MODES = [["info", "Look"], ["success", "Sandbox"], ["warning", "Direct"], ["danger", "Direct raw"]];

  // WCAG 2.2 relative luminance and contrast ratio.
  const lum = hex => {
    const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map(x => x <= 0.04045 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4);
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  const badge = (r, min) => `<span class="ratio ${r >= min ? "ok" : "fail"}">${r.toFixed(1)}</span>`;

  const host = document.getElementById("themes");
  for (const [id, name, note] of THEMES) {
    const el = document.getElementById("theme-tpl").content.firstElementChild.cloneNode(true);
    el.dataset.theme = id;
    host.appendChild(el);
    const css = getComputedStyle(el);
    const v = k => css.getPropertyValue("--" + k).trim();

    el.querySelector("[data-name]").textContent = name;
    el.querySelector("[data-note]").textContent = note;
    el.querySelector("[data-surfaces]").innerHTML = SURFACES.map(([k, token, label]) => {
      const fg = k === "accent" ? v("on-accent") : v("text-primary");
      return `<div class="sw" style="background:${v(k)};color:${fg}"><b>${label}</b><span class="mono">${token} ${v(k)}</span></div>`;
    }).join("") + `<div class="sw" style="background:${v("bg-surface1")}"><b>Divider</b><span class="mono">border.subtle ${v("border-subtle")}</span></div>`
      + `<div class="sw" style="background:${v("bg-surface1")};border:2px solid ${v("border-strong")}"><b>Input outline</b><span class="mono">border.strong ${v("border-strong")}</span></div>`;

    const head = `<tr><th></th>${BGS.map(b => `<th>${b.replace("bg-", "")}</th>`).join("")}</tr>`;
    el.querySelector("[data-text]").innerHTML = head + TEXTS.map(([k, label]) =>
      `<tr><td>${label}</td>${BGS.map(b => `<td><div class="cell" style="background:${v(b)};color:${v(k)}">Aa ${badge(ratio(v(k), v(b)), 4.5)}</div></td>`).join("")}</tr>`).join("");
    el.querySelector("[data-status]").innerHTML = head + STATUS.map(([k, label]) =>
      `<tr><td>${label}</td>${BGS.map(b => `<td><div class="cell" style="background:${v(b)};color:${v(k)}">Aa ${badge(ratio(v(k), v(b)), 4.5)}</div></td>`).join("")}</tr>`).join("");
    el.querySelector("[data-modes]").innerHTML = MODES.map(([k, label]) =>
      `<span class="pill" style="color:${v(k)}"><i></i>${label}</span>`).join("");

    el.querySelectorAll("[data-ratio]").forEach(s => {
      const [fg, bg, min] = s.dataset.ratio.split("|");
      const r = ratio(v(fg), v(bg));
      s.textContent = `${s.textContent} ${r.toFixed(1)}`;
      s.classList.add(r >= +min ? "ok" : "fail");
    });
    el.querySelector("[data-spaces]").innerHTML = [2, 4, 8, 12, 16, 24, 32, 48]
      .map(n => `<div><span style="width:${n}px;height:${n}px"></span>${n}</div>`).join("");
  }
</script>
</body>
</html>
