<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Pinned font rendering for UI screenshots (0.11): the system fonts
     (Inter, JetBrains Mono and Noto from Arch packages in the CI image),
     greyscale antialiasing and no hinting, so pictures don't depend on a
     machine's font settings. The screenshot harness (xtask/src/shots.rs)
     points FONTCONFIG_FILE here. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <!-- Devanagari falls back from Inter to Noto Sans Devanagari (11 §2.2). -->
  <alias>
    <family>Inter</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans Devanagari</family>
    </prefer>
  </alias>
</fontconfig>
